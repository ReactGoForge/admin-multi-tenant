"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "parameters":
    "Page":
      "name": "page"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "default": 1
    "PageSize":
      "name": "pageSize"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 100
        "default": 10
  "responses":
    "BadRequest":
      "description": "请求参数错误"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "Unauthorized":
      "description": "登录状态无效"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "Forbidden":
      "description": "权限不足"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "NotFound":
      "description": "资源不存在"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "Conflict":
      "description": "数据冲突或资源受保护"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "InternalError":
      "description": "服务内部错误"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
    "ServiceUnavailable":
      "description": "必要依赖或外部服务不可用"
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "code":
                "type": "integer"
              "message":
                "type": "string"
              "data":
                "type": "null"
            "required":
              - "code"
              - "message"
              - "data"
