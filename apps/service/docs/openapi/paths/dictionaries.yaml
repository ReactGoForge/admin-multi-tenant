"pathApiAdminPlatformDictionaries":
  "get":
    "tags":
      - "PlatformDictionaries"
    "operationId": "getApiAdminPlatformDictionaries"
    "summary": "GET /api/admin/platform/dictionaries"
    "security":
      -
        "bearerAuth": []
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/DictionaryTypeList"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "../openapi.yaml#/components/responses/Forbidden"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
  "post":
    "tags":
      - "PlatformDictionaries"
    "operationId": "postApiAdminPlatformDictionaries"
    "summary": "POST /api/admin/platform/dictionaries"
    "security":
      -
        "bearerAuth": []
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "../openapi.yaml#/components/schemas/DictionaryTypeRequest"
    "responses":
      "201":
        "description": "创建成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "type": "null"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
