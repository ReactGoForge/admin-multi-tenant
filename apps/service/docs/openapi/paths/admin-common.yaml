"pathApiAdminMe":
  "get":
    "tags":
      - "AdminCommon"
    "operationId": "getApiAdminMe"
    "summary": "GET /api/admin/me"
    "security":
      -
        "bearerAuth": []
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/AdminCurrentUser"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "../openapi.yaml#/components/responses/Forbidden"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
