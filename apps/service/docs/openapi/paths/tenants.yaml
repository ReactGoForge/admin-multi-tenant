        "name": "name"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
      -
        "name": "status"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
          "enum":
            - "enabled"
            - "disabled"
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
