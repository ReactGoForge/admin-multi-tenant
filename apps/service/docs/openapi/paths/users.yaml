"pathApiAdminPlatformUsers":
  "get":
    "tags":
      - "PlatformUsers"
    "operationId": "getApiAdminPlatformUsers"
    "summary": "GET /api/admin/platform/users"
    "security":
      -
        "bearerAuth": []
    "parameters":
      -
        "$ref": "../openapi.yaml#/components/parameters/Page"
      -
        "$ref": "../openapi.yaml#/components/parameters/PageSize"
      -
        "name": "nickname"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
      -
        "name": "phone"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
      -
        "name": "tenantId"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "BIGINT 标识以字符串传输"
      -
        "name": "status"
        "in": "query"
        "required": false
        "schema":
          "type": "string"
          "enum":
            - "enabled"
            - "disabled"
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/PlatformUserPage"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "../openapi.yaml#/components/responses/Forbidden"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
