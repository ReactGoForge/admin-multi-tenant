"pathPing":
  "get":
    "tags":
      - "Health"
    "operationId": "getPing"
    "summary": "GET /ping"
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/PingData"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
