"pathApiAdminAuthCaptcha":
  "get":
    "tags":
      - "AdminAuth"
    "operationId": "getApiAdminAuthCaptcha"
    "summary": "GET /api/admin/auth/captcha"
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/Captcha"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
"pathApiAdminAuthLogin":
  "post":
    "tags":
      - "AdminAuth"
    "operationId": "postApiAdminAuthLogin"
    "summary": "POST /api/admin/auth/login"
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "../openapi.yaml#/components/schemas/AdminLoginRequest"
    "responses":
      "200":
        "description": "请求成功"
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "integer"
                  "const": 0
                "message":
                  "type": "string"
                "data":
                  "$ref": "../openapi.yaml#/components/schemas/AdminLogin"
              "required":
                - "code"
                - "message"
                - "data"
      "400":
        "$ref": "../openapi.yaml#/components/responses/BadRequest"
      "404":
        "$ref": "../openapi.yaml#/components/responses/NotFound"
      "409":
        "$ref": "../openapi.yaml#/components/responses/Conflict"
      "500":
        "$ref": "../openapi.yaml#/components/responses/InternalError"
