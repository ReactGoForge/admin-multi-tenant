"DictionaryItem":
  "type": "object"
  "properties":
    "id":
      "type": "string"
      "pattern": "^[1-9][0-9]*$"
      "description": "BIGINT 标识以字符串传输"
    "label":
      "type": "string"
    "value":
      "type": "string"
    "sort":
      "type": "integer"
      "minimum": 0
    "status":
      "type": "string"
      "enum":
        - "enabled"
        - "disabled"
  "required":
    - "id"
    - "label"
    - "value"
    - "sort"
    - "status"
