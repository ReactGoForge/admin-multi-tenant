"Captcha":
  "type": "object"
  "properties":
    "enabled":
      "type": "boolean"
    "captchaId":
      "type": "string"
    "image":
      "type": "string"
    "expiresIn":
      "type": "integer"
      "minimum": 0
  "required":
    - "enabled"
"AdminLoginRequest":
  "type": "object"
  "properties":
    "username":
      "type": "string"
    "password":
      "type": "string"
    "captchaId":
      "type": "string"
    "captchaCode":
      "type": "string"
  "required":
    - "username"
    - "password"
"AdminLogin":
  "type": "object"
  "properties":
    "accessToken":
      "type": "string"
    "expiresAt":
      "type": "string"
      "description": "服务端时间字符串"
  "required":
    - "accessToken"
    - "expiresAt"
"CurrentRole":
  "type": "object"
  "properties":
    "id":
      "type": "string"
      "pattern": "^[1-9][0-9]*$"
      "description": "BIGINT 标识以字符串传输"
    "name":
      "type": "string"
    "systemKey":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
  "required":
    - "id"
    - "name"
    - "systemKey"
"NavigationMenu":
  "type": "object"
  "properties":
    "id":
      "type": "string"
      "pattern": "^[1-9][0-9]*$"
      "description": "BIGINT 标识以字符串传输"
    "parentId":
      "anyOf":
        -
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "BIGINT 标识以字符串传输"
        -
          "type": "null"
    "name":
      "type": "string"
    "type":
      "type": "string"
    "scope":
      "type": "string"
    "path":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "component":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "icon":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "permissionCode":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "tenantAssignable":
      "type": "boolean"
    "sort":
      "type": "integer"
      "minimum": 0
    "visible":
      "type": "boolean"
    "status":
      "type": "string"
      "enum":
        - "enabled"
        - "disabled"
  "required":
    - "id"
    - "parentId"
    - "name"
    - "type"
    - "scope"
    - "path"
    - "component"
    - "icon"
    - "permissionCode"
    - "tenantAssignable"
    - "sort"
    - "visible"
    - "status"
"AdminCurrentUser":
  "type": "object"
  "properties":
    "employeeId":
      "type": "string"
      "pattern": "^[1-9][0-9]*$"
      "description": "BIGINT 标识以字符串传输"
    "name":
      "type": "string"
    "loginAccount":
      "type": "string"
    "phone":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "avatarText":
      "type": "string"
    "avatarUrl":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "workspace":
      "type": "string"
      "enum":
        - "platform"
        - "tenant"
    "tenantId":
      "anyOf":
        -
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "BIGINT 标识以字符串传输"
        -
          "type": "null"
    "tenantName":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "tenantIconUrl":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "platformName":
      "type": "string"
    "platformIconUrl":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
    "mode":
      "type": "string"
      "enum":
        - "normal"
        - "managed"
    "isSuperAdmin":
      "type": "boolean"
    "roles":
      "type": "array"
      "items":
        "$ref": "../openapi.yaml#/components/schemas/CurrentRole"
    "permissions":
      "type": "array"
      "items":
        "type": "string"
    "menus":
      "type": "array"
      "items":
        "$ref": "../openapi.yaml#/components/schemas/NavigationMenu"
  "required":
    - "employeeId"
    - "name"
    - "loginAccount"
    - "phone"
    - "avatarText"
    - "avatarUrl"
    - "workspace"
    - "tenantId"
    - "tenantName"
    - "tenantIconUrl"
    - "platformName"
    - "platformIconUrl"
    - "mode"
    - "isSuperAdmin"
    - "roles"
    - "permissions"
    - "menus"
"BasicProfileRequest":
  "type": "object"
  "properties":
    "name":
      "type": "string"
    "phone":
      "anyOf":
        -
          "type": "string"
        -
          "type": "null"
  "required":
    - "phone"
"ChangePasswordRequest":
  "type": "object"
  "properties":
    "currentPassword":
      "type": "string"
    "newPassword":
      "type": "string"
  "required":
    - "currentPassword"
    - "newPassword"
"AvatarResult":
  "type": "object"
  "properties":
    "avatarUrl":
      "type": "string"
      "format": "uri"
  "required":
    - "avatarUrl"
